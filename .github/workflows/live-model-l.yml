# Model L live jobs on GitHub Actions.
#
# WHICH JOB CALLS WHICH SCRIPT (Priority 1c) — there is exactly ONE live pipeline, and
# exactly THREE schedules: two daily legs and one weekly audit.
#
#   15:00 IST, weekdays  (cron "30 9 * * 1-5")   ->  python send_daily_email.py
#       Chittorgarh market view, scores every mainboard IPO closing today, logs the
#       predictions, appends the 1500 snapshot, writes reports/live/<date>.md, SENDS THE
#       BID/NO-BID EMAIL.
#
#       15:00 and not 15:30: GitHub's scheduler drifts 5-15 minutes under load and the
#       broker cutoff is 16:00 IST (E1), so 15:00 still lands 45 minutes clear.
#
#       THIS LEG IS NEVER CAUGHT UP (Priority 1d). A bid signal after 16:00 invites a bid
#       that cannot be placed, so `send_window()` refuses to send outside 14:00-16:00 IST
#       and the run exits non-zero. Every 15:00 marker on record before 2026-10-08 was
#       stamped after the cutoff - 16:53, 21:49, 22:11, 00:06, 00:39 - and sent anyway.
#       That is the defect the window closes, and it is what makes the retry below safe:
#       a retried email leg cannot deliver a dead signal, it can only fail again.
#
#   19:30 IST, weekdays  (cron "0 14 * * 1-5")   ->  send_daily_email.py --final
#                                                    capture_audit.py --catch-up
#                                                    listing_prices.py --capture-listing-day
#       The day-end capture: final subscription, the 15 index closes, and listing-day
#       prices for anything that listed today.
#
#       19:30 and not 17:30: NSE Indices publishes the day's index closes after the
#       settlement run, and 17:30 was reading an incomplete table. The catch-up step runs
#       FIRST so a day lost to an infrastructure fault is recovered before today's work.
#
#   10:30 IST, Saturdays (cron "0 5 * * 6")      ->  capture_audit.py --audit --days 7
#       Priority 1e. Checks that every weekday in the week left an attempt, and FAILS the
#       run if one did not. Evidence is `live_markers.attempts()`, not `already_ran()`: a
#       job that ran and captured nothing is a quiet market, not a gap.
#
# `run_live_l.py` is NOT scheduled. It reads NSE and BSE directly and has never captured a
# row, yet it used to write to the same report path as the working pipeline - so on 2 Oct
# its failing 21:49 run overwrote the good report produced minutes earlier. It is kept as a
# manually-dispatched exchange-access probe writing to reports/live/exchange_probe/, which
# is exactly what Priority 2 re-tests now that NSE has answered the access request.
#
# Why Actions rather than the desktop app or Task Scheduler: app routines only fire while
# the app is open and Task Scheduler only while the laptop is awake. Neither is acceptable
# for a job whose whole value is landing before a 16:00 cutoff.
#
# Cron here is UTC. IST is UTC+5:30.
#   15:00 IST = 09:30 UTC    19:30 IST = 14:00 UTC    Sat 10:30 IST = Sat 05:00 UTC
#
# The jobs are idempotent: each writes a run marker, and a second run on the same date and
# capture point is a no-op. Since Priority 1f a marker only counts when the run actually
# captured something, so a failed attempt no longer locks out its own retry.
#
# NETWORK (updated for H18): NSE, BSE and NSE Indices are all reachable. The earlier
# "every official host refuses this project" note was wrong in its diagnosis - the block
# was a User-Agent filter, not a policy, and all three return robots.txt 200 with
# `Allow: /` under realistic browser headers. Realistic headers to OFFICIAL hosts are
# permitted by H18. Still forbidden: any login, CAPTCHA, paywall or click-through, an
# explicit robots.txt disallow, and the B1 blacklist.

name: Model L live

on:
  schedule:
    # ALL CRON BELOW IS UTC. GitHub reads cron as UTC and nothing else.
    # IST = UTC + 5:30. Each line states the IST time it fires at.
    #
    # Four attempts at the bid email, 15 minutes apart, all inside the 14:00-16:00 IST
    # send window. The first one that succeeds sends; the rest find the sent marker and
    # exit green (Task 4). Four lines rather than one because GitHub drops and delays
    # scheduled runs - see the delay table in LIVE_SETUP.md.
    - cron: "45 8 * * 1-5"      # 08:45 UTC = 14:15 IST, weekdays — EMAIL attempt 1
    - cron: "0 9 * * 1-5"       # 09:00 UTC = 14:30 IST, weekdays — EMAIL attempt 2
    - cron: "15 9 * * 1-5"      # 09:15 UTC = 14:45 IST, weekdays — EMAIL attempt 3
    - cron: "30 9 * * 1-5"      # 09:30 UTC = 15:00 IST, weekdays — EMAIL attempt 4
    - cron: "0 14 * * 1-5"      # 14:00 UTC = 19:30 IST, weekdays — day-end capture:
                                #   catch-up, final subscription, 15 index closes,
                                #   listing-day prices
    - cron: "0 5 * * 6"         # 05:00 UTC = 10:30 IST Saturdays — weekly capture audit
    #
    # Task 9, the HDFIRE intraday test, 13-15 Oct only. Four polls a day.
    # A BACKSTOP, NOT THE PLAN: measured over nine scheduled runs 2-8 Oct, GitHub's
    # scheduler was 5h31m to 9h06m late, so a poll meant for 11:00 IST may arrive in the
    # evening. The real trigger is cron-job.org or a manual dispatch; the poller records
    # its REAL time either way, so a drifted poll is still usable data. The script exits
    # immediately outside 13-15 Oct.
    - cron: "30 5 * * 1-5"      # 05:30 UTC = 11:00 IST — HDFIRE poll 1
    - cron: "30 7 * * 1-5"      # 07:30 UTC = 13:00 IST — HDFIRE poll 2
    - cron: "31 9 * * 1-5"      # 09:31 UTC = 15:01 IST — HDFIRE poll 3
    - cron: "1 12 * * 1-5"      # 12:01 UTC = 17:31 IST — HDFIRE poll 4
                                #   NOT "0 12", which was the retired 17:30
                                #   day-end cron - reusing that exact string
                                #   would look like 17:30 had come back
  workflow_dispatch:
    inputs:
      mode:
        description: "which job to run"
        required: true
        default: "email"
        type: choice
        # Task 4. Every option here MUST have a branch in the `case` in the Run step
        # below. `dry-run`, `probe` and `rehearse` were listed here with no branch, so
        # choosing one ran nothing and exited 0 - a green run that did no work. `rehearse`
        # is gone (it never meant anything); the other two now run something, and an
        # unmatched mode exits 1.
        options: [email, final, listing, audit, catch-up, test-email, poll, dry-run, probe, retrain]

concurrency:
  # One live job at a time. Two runs appending to predictions_log.csv concurrently would
  # interleave rows; the idempotency marker prevents duplicates but not interleaving.
  group: model-l-live
  cancel-in-progress: false

permissions:
  contents: write              # the job commits snapshots and the prediction log

jobs:
  live:
    # Priority 1h: PINNED. `ubuntu-latest` migrates to Ubuntu 26 on 19 Oct 2026, and a
    # runner image changing underneath a job whose entire value is landing before a broker
    # cutoff is a risk taken for nothing. Bump this deliberately, after a manual dispatch
    # on the new image has passed.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Priority 1h: checkout@v4 and setup-python@v5 run on the deprecated Node 20.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Fails the run BEFORE any fetch if the live path has picked up a dependency that
      # requirements.txt does not list. This is the check that would have caught the joblib
      # breakage on 1 Oct instead of three silent days later.
      - name: Verify the live path imports in this environment
        run: |
          python -c "import send_daily_email, ipo_calendar, chittorgarh_live, score_l, predictions_log, live_markers, market_context, capture_audit, trading_day, sent_markers, nse_subscription; print('live path imports OK')"
          python score_l.py --self-test
          python live_markers.py --self-test
          python market_context.py --self-test
          python send_daily_email.py --self-test
          python ipo_calendar.py --self-test
          python listing_prices.py --self-test
          python capture_audit.py --self-test
          python trading_day.py --self-test
          python sent_markers.py --self-test
          python nse_subscription.py --self-test
          python hdfire_poll.py --self-test

      # Task 1. ONE trading date per run, computed in Asia/Kolkata and frozen here.
      # Run #11 started at 23:59:30 IST on 7 October, crossed midnight mid-job, and
      # stamped itself 2026-10-08 - so it asked NSE Indices for a date that had not
      # happened and logged 15 NULLs instead of 7 October's closes. TZ was already
      # Asia/Kolkata; the bug was that each step asked the clock again.
      - name: Fix this run's trading date (IST, from the DUE time)
        run: |
          # Task 1. For a SCHEDULE run the date comes from the cron slot the run was due
          # for, not from the clock it woke up on. The day-end leg due 19:30 IST on
          # 9 October actually started 00:46 IST on 10 October and stamped itself
          # 2026-10-10 - a Saturday, with no index closes to collect. A run seven hours
          # late is still working on the day it was due for.
          #
          # For a workflow_dispatch there is no slot - somebody pressed it now - so the
          # real IST clock is the right answer. `trading_day.py --due-date` handles both:
          # an empty --cron means dispatch.
          CRON='${{ github.event.schedule }}'
          TD=$(python trading_day.py --due-date --cron "$CRON")
          echo "TRADING_DATE=$TD" >> "$GITHUB_ENV"
          echo "cron that fired  : '$CRON' (UTC)"
          echo "trading date     : $TD  (the slot this run was DUE for, in IST)"
          echo "wall clock  (IST): $(TZ=Asia/Kolkata date '+%F %H:%M:%S %Z')"
          echo "wall clock  (UTC): $(date -u '+%F %H:%M:%S')"
          if [ "$TD" != "$(TZ=Asia/Kolkata date +%F)" ]; then
            echo "::warning::This run is late: it is $(TZ=Asia/Kolkata date +%F) in IST but it is doing $TD's work."
          fi

      - name: Decide which job this run is
        id: which
        run: |
          # Mapped from the cron string, which is UTC. The four email crons all map to
          # `email`; only an exact match on the day-end or audit cron selects those, so a
          # new cron line cannot silently inherit `email` by falling through.
          case "${{ github.event_name }}:${{ github.event.schedule }}" in
            workflow_dispatch:*)          mode="${{ inputs.mode }}" ;;
            schedule:"0 14 * * 1-5")      mode=final ;;
            schedule:"0 5 * * 6")         mode=audit ;;
            schedule:"30 5 * * 1-5")      mode=poll ;;
            schedule:"30 7 * * 1-5")      mode=poll ;;
            schedule:"31 9 * * 1-5")      mode=poll ;;
            schedule:"1 12 * * 1-5")      mode=poll ;;
            schedule:"45 8 * * 1-5")      mode=email ;;
            schedule:"0 9 * * 1-5")       mode=email ;;
            schedule:"15 9 * * 1-5")      mode=email ;;
            schedule:"30 9 * * 1-5")      mode=email ;;
            *) echo "unrecognised trigger: ${{ github.event_name }} / ${{ github.event.schedule }}" >&2
               exit 1 ;;
          esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "resolved mode=$mode from ${{ github.event_name }} / cron '${{ github.event.schedule }}' (UTC)"

      - name: Run
        env:
          PYTHONIOENCODING: utf-8
          TZ: Asia/Kolkata
          # Read by send_daily_email.py. A missing secret FAILS the run rather than
          # skipping the email: a silently skipped email looks identical to a quiet
          # market, and silence must always mean something broke.
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          # Priority 1e. Falls back to GMAIL_ADDRESS when unset.
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          case "${{ steps.which.outputs.mode }}" in
            email)    python send_daily_email.py ;;
            listing)  python listing_prices.py --capture-listing-day ;;
            retrain)  # 6b. The monthly review that replaces the ipo-retrain-monthly
                      # Claude routine: thresholds re-derived walk-forward, delivered
                      # against promised, the tripwire (H19 + H24), the drift guard, the
                      # trailing-12m IPO count, and the predictions_log header guard.
                      # It NEVER applies a threshold - it reports and emails.
                      python retrain_review.py --email ;;
            final)    # Priority 1d: recover a day lost to an infrastructure fault
                      # BEFORE today's capture, so a gap does not compound. Listing
                      # prices and index closes are both readable from an archive; final
                      # subscription is NOT (Chittorgarh removes the table at allotment),
                      # and capture_audit.py says so instead of leaving a silent hole.
                      python capture_audit.py --catch-up --days 4
                      python send_daily_email.py --final
                      # 2d STANDING RULE: a newly listed IPO's price is captured ON ITS
                      # LISTING DATE, never later. A price read afterwards has been
                      # retroactively restated for any split or bonus since, silently --
                      # Syngene's real Rs 295 open reads Rs 147.50 once its 2017 bonus is
                      # applied. Run at 19:30 because the bhavcopy is published after the
                      # close. This also scores (2e) any prediction the label settles.
                      python listing_prices.py --capture-listing-day
                      # 6a. The HARVEST, formerly the ipo-ingest-outcomes Claude routine.
                      # It asks NSE's own public-past-issues what has listed - never the
                      # Chittorgarh night-sweep calendar, which goes stale - requires the
                      # company NAME and the listing DATE to agree, and is idempotent on
                      # symbol plus listing date so this deliberately overlapping window
                      # can run every weekday. It prices NOTHING: prices come only from
                      # the bhavcopy ON the listing date, captured by the step above.
                      #
                      # An ingest failure must NEVER cost us the capture. The capture is
                      # time-critical and irreplaceable; the harvest can be repeated any
                      # day. So its exit code is recorded to a file and the run is failed
                      # at the END, by the "Fail the run if the outcome ingest failed"
                      # step, after everything has been committed and pushed.
                      ingest_rc=0
                      python ingest_outcomes.py --since 2026-10-01 || ingest_rc=$?
                      echo "$ingest_rc" > "$RUNNER_TEMP/ingest_rc"
                      if [ "$ingest_rc" -ne 0 ]; then
                        echo "::warning::outcome ingest FAILED (exit $ingest_rc); the day-end capture itself succeeded and this run will be failed at the end"
                      fi ;;
            audit)    # Priority 1e. Exits 1 on an open gap, so the run goes red and the
                      # gap is visible without anybody reading a report.
                      python capture_audit.py --audit --days 7 ;;
            catch-up) python capture_audit.py --catch-up --days 7 ;;
            poll)     # Task 9. Exits immediately outside 13-15 Oct.
                      python hdfire_poll.py --label "$(TZ=Asia/Kolkata date +%H%M)" ;;
            test-email) # Task 5. Real SMTP, real composition, subject
                      # `IPO decision - TEST`, built from the last closed
                      # IPO on record. Writes no sent marker and logs no
                      # prediction - a test is not a decision.
                      python send_daily_email.py --test-email ;;
            dry-run)  # Compose and print, send nothing, write no marker.
                      python send_daily_email.py --dry-run ;;
            probe)    # Priority 2 / H18: the exchange-access probe. Writes to
                      # reports/live/exchange_probe/, never to the live report path.
                      python run_live_l.py ;;
            *)        echo "::error::mode '${{ steps.which.outputs.mode }}' has no branch here. A dispatch option with no branch runs nothing and exits 0, which looks green."
                      exit 1 ;;
          esac

      - name: Outcome ingest line in the run summary
        if: always() && steps.which.outputs.mode == 'final'
        run: |
          # 6a: the ingest gets its OWN line, whatever happened, so a failure is visible
          # without reading the log.
          rc="$(cat "$RUNNER_TEMP/ingest_rc" 2>/dev/null || echo missing)"
          case "$rc" in
            0)       echo "- **Outcome ingest**: OK" >> "$GITHUB_STEP_SUMMARY" ;;
            missing) echo "- **Outcome ingest**: the run did not reach the ingest step" >> "$GITHUB_STEP_SUMMARY" ;;
            *)       echo "- **Outcome ingest**: **FAILED** (exit $rc). The day-end capture itself succeeded; this run is failed deliberately so the failure is not lost." >> "$GITHUB_STEP_SUMMARY" ;;
          esac

      - name: Commit whatever was produced
        env:
          TZ: Asia/Kolkata
        run: |
          git config user.name  "ipo-agent[bot]"
          git config user.email "ashishkohar4@gmail.com"
          # Priority 4a. `git add -A a b c` stages NOTHING if any one pathspec is
          # missing: it exits 128 before staging anything, and the `|| true` that used to
          # be here masked that completely. data/subscription_snapshots.csv did not exist,
          # so every run that produced no snapshot staged nothing, printed "nothing
          # produced", exited 0 and looked GREEN while leaving no record in the repo that
          # it had run at all. Staging each path on its own means one absent file can no
          # longer suppress the others.
          for f in data/subscription_snapshots.csv data/predictions_log.csv data/market_context.csv data/market_context_notes.csv data/live_fetch_log.csv data/live_run_markers.csv data/listing_prices.csv data/listing_prices_progress.csv reports/live reports/CAPTURE_AUDIT.md data/sent_markers.csv data/final_subscription.csv data/hdfire_poll.csv data/new_listings.csv reports/HDFIRE_INTRADAY.md; do
            if [ -e "$f" ]; then
              git add -A -- "$f" || echo "could not stage $f"
            else
              echo "not produced this run: $f"
            fi
          done
          if git diff --cached --quiet; then
            echo "nothing produced — most likely a source block. Not committing."
            exit 0
          fi
          git commit -m "Live ${{ steps.which.outputs.mode }} run $(date +%Y-%m-%dT%H:%M%z)

          Automated by .github/workflows/live-model-l.yml. Verdicts are the
          threshold met, never a probability (decision G2)."
          # Task 2. The concurrency group above means two runs of THIS workflow never
          # reach here at once, but it does not stop a push from the retry workflow, a
          # manual dispatch of another workflow, or the laptop. So the push is retried:
          # rebase onto whatever landed, then push again. Five attempts with a short
          # backoff, and a real failure at the end rather than a swallowed one - an
          # unpushed capture is a capture that does not exist.
          pushed=no
          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash origin main || true
            if git push origin HEAD:main; then
              pushed=yes
              echo "pushed on attempt $attempt"
              break
            fi
            echo "push rejected on attempt $attempt - rebasing onto origin/main and retrying"
            sleep $((attempt * 5))
          done
          if [ "$pushed" != "yes" ]; then
            echo "::error::Five pushes rejected. The work is committed locally on a throwaway runner, which means it is lost."
            exit 1
          fi

      # Priority 1d: the 15:00 leg must FAIL LOUDLY. A failed run that says nothing is
      # indistinguishable from a quiet market, and silence must always mean something
      # broke. This fires only for the email leg, and only when it failed.
      - name: The bid email did not go out
        if: failure() && steps.which.outputs.mode == 'email'
        run: |
          {
            echo "## THE 15:00 BID EMAIL DID NOT GO OUT"
            echo ""
            echo "This leg is **never caught up**. A bid signal after the 16:00 IST broker"
            echo "cutoff invites a bid that can no longer be placed, so re-running this"
            echo "later will refuse to send by design (send_window in send_daily_email.py)."
            echo ""
            echo "If today had an IPO closing, the decision was NOT delivered."
            echo "Check reports/live/$(TZ=Asia/Kolkata date +%F).md for what it would have said."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Fail the run if the outcome ingest failed
        # 6a. LAST, and `always()`, so the capture is committed and pushed first. The
        # harvest failing is not allowed to cost us the capture, but it is not allowed to
        # pass unnoticed either - the run goes red and the summary line says why.
        if: always() && steps.which.outputs.mode == 'final'
        run: |
          rc="$(cat "$RUNNER_TEMP/ingest_rc" 2>/dev/null || echo 0)"
          if [ "$rc" != "0" ] && [ "$rc" != "missing" ]; then
            echo "::error::outcome ingest exited $rc. The day-end capture succeeded and is committed; this failure is the harvest only."
            exit 1
          fi
          echo "outcome ingest status: $rc"

      - name: Summarise for the run log
        if: always()
        run: |
          echo "### Model L — ${{ steps.which.outputs.mode }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "reports/live/$(TZ=Asia/Kolkata date +%F).md" ]; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat "reports/live/$(TZ=Asia/Kolkata date +%F).md" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report written. The 19:30 day-end leg writes no report by design; for an email leg, check the diagnostics above." >> "$GITHUB_STEP_SUMMARY"
          fi
