# Model L live jobs on GitHub Actions.
#
# WHICH JOB CALLS WHICH SCRIPT (Priority 1c) — there is now exactly ONE live pipeline:
#
#   15:00 IST (cron "30 9 * * 1-5")  ->  python send_daily_email.py
#       Chittorgarh market view, scores every mainboard IPO closing today, logs the
#       predictions, appends the 1500 snapshot, writes reports/live/<date>.md, SENDS THE
#       EMAIL.
#   17:30 IST (cron "0 12 * * 1-5")  ->  python send_daily_email.py --final
#       Chittorgarh again after the close, appends the 1730 snapshot and the day's index
#       closes. NO email: the bid window has shut, so there is nothing left to decide.
#
# `run_live_l.py` is NOT scheduled any more. It reads NSE (connection reset) and BSE (403)
# and has never captured a row, yet it wrote to the same report path as the working
# pipeline — so on 2 Oct its failing 21:49 run overwrote the good Chittorgarh report. It is
# kept as a manually-run exchange-access probe writing to reports/live/exchange_probe/,
# ready for the day NSE answers the access request.
#
# Why Actions as well as the laptop: app-based schedules only fire while the desktop app is
# open and Task Scheduler only while the laptop is awake. Neither is reliable for a job
# whose whole value is landing before a 16:00 IST broker cutoff. GitHub's scheduler drifts
# 5-15 minutes under load, which is why the scoring job is set for 15:00 rather than 15:30:
# even a 15-minute drift still lands 45 minutes before the cutoff.
#
# Cron here is UTC. IST is UTC+5:30.  15:00 IST = 09:30 UTC   17:30 IST = 12:00 UTC
#
# The jobs are idempotent: each writes a run marker and a second run on the same date and
# capture point exits as a no-op. Since Priority 1f, a marker only counts when the run
# actually captured something — a failed attempt no longer locks out its own retry.
#
# NETWORK: NSE resets or times out this project's User-Agent, BSE returns 403 even on
# robots.txt, and niftyindices.com read-times-out on every path including /robots.txt. The
# jobs log each block and write nothing invented. They do NOT fall back to a browser
# User-Agent (project rule 3).

name: Model L live

on:
  schedule:
    - cron: "30 9 * * 1-5"      # 15:00 IST, weekdays — score, snapshot, report, EMAIL
    - cron: "0 12 * * 1-5"      # 17:30 IST, weekdays — final snapshot + index closes
  workflow_dispatch:
    inputs:
      mode:
        description: "which job to run"
        required: true
        default: "email"
        type: choice
        options: [email, final, dry-run, probe, rehearse]

concurrency:
  # One live job at a time. Two runs appending to predictions_log.csv concurrently would
  # interleave rows; the idempotency marker prevents duplicates but not interleaving.
  group: model-l-live
  cancel-in-progress: false

permissions:
  contents: write              # the job commits snapshots and the prediction log

jobs:
  live:
    # Priority 1h: PINNED. `ubuntu-latest` migrates to Ubuntu 26 on 19 Oct 2026, and a
    # runner image changing underneath a job whose entire value is landing before a broker
    # cutoff is a risk taken for nothing. Bump this deliberately, after a manual dispatch
    # on the new image has passed.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Priority 1h: checkout@v4 and setup-python@v5 run on the deprecated Node 20.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Fails the run BEFORE any fetch if the live path has picked up a dependency that
      # requirements.txt does not list. This is the check that would have caught the joblib
      # breakage on 1 Oct instead of three silent days later.
      - name: Verify the live path imports in this environment
        run: |
          python -c "import send_daily_email, chittorgarh_live, score_l, predictions_log, live_markers, market_context; print('live path imports OK')"
          python score_l.py --self-test
          python live_markers.py --self-test
          python market_context.py --self-test
          python send_daily_email.py --self-test

      - name: Decide which job this run is
        id: which
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 12 * * 1-5" ]; then
            echo "mode=final" >> "$GITHUB_OUTPUT"
          else
            echo "mode=email" >> "$GITHUB_OUTPUT"
          fi

      - name: Run
        env:
          PYTHONIOENCODING: utf-8
          TZ: Asia/Kolkata
          # Read by send_daily_email.py. A missing secret FAILS the run rather than
          # skipping the email: a silently skipped email looks identical to a quiet
          # market, and silence must always mean something broke.
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          # Priority 1e. Falls back to GMAIL_ADDRESS when unset.
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          case "${{ steps.which.outputs.mode }}" in
            email)    python send_daily_email.py ;;
            final)    python send_daily_email.py --final ;;
            dry-run)  python send_daily_email.py --dry-run ;;
            probe)    python run_live_l.py --probe ;;
            rehearse) python run_live_l.py --rehearse ;;
          esac

      - name: Commit whatever was produced
        env:
          TZ: Asia/Kolkata
        run: |
          git config user.name  "ipo-agent[bot]"
          git config user.email "ashishkohar4@gmail.com"
          git add -A data/subscription_snapshots.csv predictions_log.csv \
                     data/market_context.csv data/market_context_notes.csv \
                     data/live_fetch_log.csv \
                     reports/live data/live_run_markers.csv || true
          if git diff --cached --quiet; then
            echo "nothing produced — most likely a source block. Not committing."
            exit 0
          fi
          git commit -m "Live ${{ steps.which.outputs.mode }} run $(date +%Y-%m-%dT%H:%M%z)

          Automated by .github/workflows/live-model-l.yml. Verdicts are the
          threshold met, never a probability (decision G2)."
          # Another run may have pushed between checkout and here.
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: Summarise for the run log
        if: always()
        run: |
          echo "### Model L — ${{ steps.which.outputs.mode }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "reports/live/$(TZ=Asia/Kolkata date +%F).md" ]; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat "reports/live/$(TZ=Asia/Kolkata date +%F).md" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report written. The 17:30 leg writes no report by design; for the 15:00 leg, check the diagnostics above." >> "$GITHUB_STEP_SUMMARY"
          fi
